<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>联系收件箱｜老旧默片</title><link rel="stylesheet" href="/admin/submissions.css"><link rel="stylesheet" href="/admin/contacts.css"></head>
<body class="review-v2"><a class="skip-link" href="#review-detail">跳到联系详情</a><div class="desk"><header class="desk-header"><div><p class="eyebrow">档案工作台 · 内部管理</p><h1>联系收件箱</h1><p>合作、隐私问题与其他来信都在这里人工处理。</p></div><nav><a href="/admin/">返回档案管理</a><a href="/admin/submissions.html">投稿审核</a><button type="button" id="refresh-contacts">刷新收件箱</button></nav></header>
<div class="stats" id="contact-stats" aria-label="联系概览"></div><div id="desk-message" role="status" aria-live="polite"></div>
<main class="review-grid"><aside class="inbox"><div class="inbox-tools"><label for="inbox-search">搜索来信</label><input id="inbox-search" type="search" placeholder="联系编号、称呼、来信类型"><label for="inbox-filter">类型或状态</label><select id="inbox-filter"><option value="all">全部来信</option><optgroup label="来信类型"><option value="category:privacy">隐私问题</option><option value="category:collab">合作洽谈</option><option value="category:other">其他事宜</option></optgroup><optgroup label="处理状态"><option value="status:received">已收到</option><option value="status:reviewing">核对中</option><option value="status:needs_info">等待补充</option><option value="status:replied">已回复</option><option value="status:closed">已结束</option></optgroup></select></div><p id="inbox-count" class="hint" role="status"></p><div id="contact-list"></div><div class="pagination"><button id="previous-page" type="button">上一页</button><span id="page-count"></span><button id="next-page" type="button">下一页</button></div></aside><article id="review-detail" class="review-detail" tabindex="-1"><div class="empty"><span aria-hidden="true">✉</span><h2>等待一封来信</h2><p>选择左侧来信后，可以查看私密联系方式、留言内容和处理记录。</p></div></article></main>
</div><script src="/admin/contacts.js" type="module"></script></body></html>
