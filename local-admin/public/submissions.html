<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>投稿审核｜老旧默片</title><link rel="stylesheet" href="/admin/submissions.css"></head>
<body class="review-v2"><a class="skip-link" href="#review-detail">跳到审核详情</a><div class="desk"><header class="desk-header"><div><p class="eyebrow">档案工作台 · 内部管理</p><h1>投稿审核</h1><p>先读来信，再核实，最后整理成档案。</p></div><nav><a href="/admin/">返回档案管理</a><a href="/admin/contacts.html">联系收件箱</a><button type="button" id="refresh-submissions">刷新收件箱</button></nav></header>
<div class="stats" id="submission-stats" aria-label="投稿概览"></div><div id="desk-message" role="status" aria-live="polite"></div>
<main class="review-grid"><aside class="inbox"><div class="inbox-tools"><label for="inbox-search">搜索来稿</label><input id="inbox-search" type="search" placeholder="投稿编号、标题、资料类型"><label for="inbox-filter">处理状态</label><select id="inbox-filter"><option value="all">全部投稿</option><option value="pending">待审核</option><option value="needs_info">待补充</option><option value="approved">初审通过</option><option value="declined">暂不采用</option><option value="withdrawn">已停止处理</option><option value="withdrawal">停止处理申请</option></select></div><p id="inbox-count" class="hint" role="status"></p><div id="submission-list"></div><div class="pagination"><button id="previous-page" type="button">上一页</button><span id="page-count"></span><button id="next-page" type="button">下一页</button></div></aside><article id="review-detail" class="review-detail" tabindex="-1"><div class="empty"><span aria-hidden="true">✉</span><h2>等一封记忆的来信</h2><p>收到投稿后，在左侧选择一份开始审核。图片、联系方式和内部记录仅在这里可见。</p></div></article></main>
</div><script src="/admin/submissions.js" type="module"></script></body></html>
